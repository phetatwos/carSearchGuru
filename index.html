<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Deal Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #c8f74a;
    --accent-dim: #8faa35;
    --text: #f0f0f0;
    --text-dim: #888;
    --red: #ff5c5c;
    --green: #c8f74a;
    --yellow: #ffd666;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    padding: 24px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  header h1 span {
    color: var(--accent);
  }

  header p {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 4px;
    font-family: 'DM Mono', monospace;
  }

  section {
    margin-bottom: 20px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  .add-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .add-btn:hover { background: var(--surface2); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-sub {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .remove-btn:hover { color: var(--red); }

  .filters-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .filter-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .filter-label {
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .filter-item input, .filter-item select {
    background: none;
    border: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    width: 100%;
    outline: none;
  }

  .filter-item select option { background: var(--surface); }

  .run-btn {
    width: 100%;
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
    letter-spacing: -0.3px;
  }
  .run-btn:hover { background: #d4fc5a; transform: translateY(-1px); }
  .run-btn:active { transform: translateY(0); }
  .run-btn:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; transform: none; }

  .log-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
    min-height: 80px;
    max-height: 260px;
    overflow-y: auto;
    display: none;
    margin-top: 12px;
  }

  .log-box.visible { display: block; }

  .log-line { color: var(--text-dim); }
  .log-line.ok { color: var(--green); }
  .log-line.err { color: var(--red); }
  .log-line.info { color: var(--text); }
  .log-line.highlight { color: var(--accent); font-weight: 500; }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 12px;
    display: none;
    overflow: hidden;
  }
  .progress-bar.visible { display: block; }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .modal-field {
    margin-bottom: 12px;
  }

  .modal-field label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }

  .modal-field input, .modal-field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
  }
  .modal-field input:focus, .modal-field select:focus {
    border-color: var(--accent);
  }
  .modal-field select option { background: var(--surface2); }

  .modal-row { display: flex; gap: 8px; }
  .modal-row .modal-field { flex: 1; }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .modal-cancel {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  .modal-save {
    flex: 2;
    background: var(--accent);
    border: none;
    color: #0e0e0e;
    border-radius: 8px;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px;
    font-family: 'DM Mono', monospace;
  }

  .download-btn {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    display: none;
  }
  .download-btn.visible { display: block; }
</style>
</head>
<body>

<header>
  <h1>Car Deal <span>Tracker</span></h1>
  <p>cargurus.ca · canada</p>
</header>

<!-- WATCHLIST -->
<section>
  <div class="section-header">
    <span class="section-label">Watchlist</span>
    <button class="add-btn" onclick="openModal('car')">+ Add Car</button>
  </div>
  <div id="watchlist-items">
    <div class="empty-state">no cars added yet</div>
  </div>
</section>

<!-- LOCATIONS -->
<section>
  <div class="section-header">
    <span class="section-label">Locations</span>
    <button class="add-btn" onclick="openModal('location')">+ Add</button>
  </div>
  <div id="location-items">
    <div class="empty-state">no locations added yet</div>
  </div>
</section>

<!-- FILTERS -->
<section>
  <div class="section-header">
    <span class="section-label">Filters</span>
  </div>
  <div class="filters-grid">
    <div class="filter-item">
      <div class="filter-label">Max Price ($)</div>
      <input type="number" id="maxPrice" value="40000">
    </div>
    <div class="filter-item">
      <div class="filter-label">Max Mileage (km)</div>
      <input type="number" id="maxMileage" value="120000">
    </div>
    <div class="filter-item">
      <div class="filter-label">Min Year</div>
      <input type="number" id="minYear" value="2018">
    </div>
    <div class="filter-item">
      <div class="filter-label">Condition</div>
      <select id="newUsed">
        <option value="2">Used</option>
        <option value="1">New</option>
        <option value="">Any</option>
      </select>
    </div>
  </div>
</section>

<!-- RUN -->
<section>
  <button class="run-btn" id="runBtn" onclick="runSearches()">🔍 Run Searches</button>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="log-box" id="logBox"></div>
  <button class="download-btn" id="downloadBtn">⬇ Download CSV</button>
</section>

<!-- ADD CAR MODAL -->
<div class="modal-overlay" id="carModal">
  <div class="modal">
    <h3>Add Car to Watchlist</h3>
    <div class="modal-field">
      <label>Make</label>
      <select id="carMakeSelect" onchange="onMakeChange()">
        <option value="">— Select a make —</option>
      </select>
    </div>
    <div class="modal-field" id="modelFieldWrapper" style="display:none">
      <label>Model <span style="color:var(--text-dim);font-size:10px;">(optional)</span></label>
      <select id="carModelSelect">
        <option value="">All models</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal('car')">Cancel</button>
      <button class="modal-save" onclick="saveCar()">Add Car</button>
    </div>
  </div>
</div>

<!-- ADD LOCATION MODAL -->
<div class="modal-overlay" id="locationModal">
  <div class="modal">
    <h3>Add Location</h3>
    <div class="modal-field">
      <label>Postal Code</label>
      <input type="text" id="locZip" placeholder="e.g. A1B 2C3">
    </div>
    <div class="modal-field">
      <label>Label</label>
      <input type="text" id="locLabel" placeholder="e.g. Toronto">
    </div>
    <div class="modal-field">
      <label>Search Radius</label>
      <select id="locDistance">
        <option value="25">25 km</option>
        <option value="50">50 km</option>
        <option value="75">75 km</option>
        <option value="100" selected>100 km</option>
        <option value="250">250 km</option>
        <option value="500">500 km</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal('location')">Cancel</button>
      <button class="modal-save" onclick="saveLocation()">Add Location</button>
    </div>
  </div>
</div>

// ── State ──────────────────────────────────────────────────────────────────
let watchlist = JSON.parse(localStorage.getItem('cgt_watchlist') || '[]');
let locations  = JSON.parse(localStorage.getItem('cgt_locations') || '[]');
let lastCSV    = null;

// ── Populate make dropdown on page load ────────────────────────────────────
function initMakeDropdown() {
  const sel = document.getElementById('carMakeSelect');
  const popular = MAKES_DATA.filter(m => m.isPopular);
  const other   = MAKES_DATA.filter(m => !m.isPopular);

  const popGroup = document.createElement('optgroup');
  popGroup.label = 'Popular';
  popular.forEach(m => {
    const o = document.createElement('option');
    o.value = m.id; o.textContent = m.name; popGroup.appendChild(o);
  });

  const otherGroup = document.createElement('optgroup');
  otherGroup.label = 'All Makes';
  other.forEach(m => {
    const o = document.createElement('option');
    o.value = m.id; o.textContent = m.name; otherGroup.appendChild(o);
  });

  sel.appendChild(popGroup);
  sel.appendChild(otherGroup);
}

function onMakeChange() {
  const makeId = document.getElementById('carMakeSelect').value;
  const wrapper = document.getElementById('modelFieldWrapper');
  const modelSel = document.getElementById('carModelSelect');

  modelSel.innerHTML = '<option value="">All models</option>';

  if (!makeId) { wrapper.style.display = 'none'; return; }

  const make = MAKES_DATA.find(m => m.id === makeId);
  if (!make || !make.models.length) { wrapper.style.display = 'none'; return; }

  make.models.forEach(mod => {
    const o = document.createElement('option');
    o.value = mod.id; o.textContent = mod.name; modelSel.appendChild(o);
  });
  wrapper.style.display = 'block';
}

// ── Persist ────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('cgt_watchlist', JSON.stringify(watchlist));
  localStorage.setItem('cgt_locations',  JSON.stringify(locations));
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const wEl = document.getElementById('watchlist-items');
  if (watchlist.length === 0) {
    wEl.innerHTML = '<div class="empty-state">no cars added yet</div>';
  } else {
    wEl.innerHTML = watchlist.map((c, i) => `
      <div class="card">
        <div class="card-info">
          <div class="card-title">${c.label}</div>
          <div class="card-sub">${c.label}</div>
        </div>
        <button class="remove-btn" onclick="removeCar(${i})">×</button>
      </div>`).join('');
  }

  const lEl = document.getElementById('location-items');
  if (locations.length === 0) {
    lEl.innerHTML = '<div class="empty-state">no locations added yet</div>';
  } else {
    lEl.innerHTML = locations.map((l, i) => `
      <div class="card">
        <div class="card-info">
          <div class="card-title">${l.label}</div>
          <div class="card-sub">${l.zip} · ${l.distance} km</div>
        </div>
        <button class="remove-btn" onclick="removeLocation(${i})">×</button>
      </div>`).join('');
  }
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(type) {
  document.getElementById(type + 'Modal').classList.add('open');
}
function closeModal(type) {
  document.getElementById(type + 'Modal').classList.remove('open');
}

function saveCar() {
  const makeId  = document.getElementById('carMakeSelect').value;
  const modelId = document.getElementById('carModelSelect').value;
  if (!makeId) return alert('Please select a make.');
  const make  = MAKES_DATA.find(m => m.id === makeId);
  const model = make?.models.find(m => m.id === modelId);
  const label = model ? `${make.name} ${model.name}` : make.name;
  watchlist.push({ makeId, modelId, label });
  save(); render(); closeModal('car');
  document.getElementById('carMakeSelect').value = '';
  document.getElementById('carModelSelect').innerHTML = '<option value="">All models</option>';
  document.getElementById('modelFieldWrapper').style.display = 'none';
}

function saveLocation() {
  const zip      = document.getElementById('locZip').value.trim().replace(' ', '+');
  const label    = document.getElementById('locLabel').value.trim();
  const distance = document.getElementById('locDistance').value;
  if (!zip || !label) return alert('Postal code and label are required');
  locations.push({ zip, label, distance: Number(distance) });
  save(); render(); closeModal('location');
  document.getElementById('locZip').value = '';
  document.getElementById('locLabel').value = '';
}

function removeCar(i)      { watchlist.splice(i, 1); save(); render(); }
function removeLocation(i) { locations.splice(i, 1); save(); render(); }

// ── Search logic ───────────────────────────────────────────────────────────
function log(msg, type = '') {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function setProgress(n, total) {
  document.getElementById('progressFill').style.width = (n / total * 100) + '%';
}

function extractListing(tile) {
  const d = tile.data;
  return {
    id:           d.id,
    title:        d.listingTitle,
    year:         d.ontologyData?.modelYear ?? '',
    make:         d.ontologyData?.makeName ?? '',
    model:        d.ontologyData?.modelName ?? '',
    trim:         d.ontologyData?.trimName ?? '',
    price:        d.priceData?.current ?? d.priceData?.totalPrice ?? '',
    mileage:      d.mileageData?.value ?? '',
    dealRating:   d.dealRating ?? '',
    dealScore:    d.dealScore != null ? d.dealScore.toFixed(2) : '',
    daysOnMarket: d.daysOnMarket ?? '',
    distance:     d.distance != null ? d.distance.toFixed(1) : '',
    drivetrain:   d.localizedDrivetrain ?? '',
    transmission: d.localizedTransmission ?? '',
    engine:       d.localizedEngineName ?? '',
    vin:          d.vin ?? '',
    seller:       d.sellerData?.name ?? '',
    sellerCity:   d.sellerData?.city ?? '',
    photos:       d.pictureCount ?? 0,
    url:          `https://www.cargurus.ca/Cars/new/nl_AllNewCars.action#listing=${d.id}`,
  };
}

async function searchOne(car, loc, filters) {
  const path = car.modelId ? `${car.makeId}/${car.modelId}` : car.makeId;
  const p = new URLSearchParams({
    zip: loc.zip,
    distance: String(loc.distance),
    makeModelTrimPaths: path,
    sortType: 'DEAL_SCORE',
    sortDirection: 'ASC',
    _data: 'routes/($intl).search',
  });
  if (filters.newUsed)    p.set('newUsed',    filters.newUsed);
  if (filters.maxPrice)   p.set('maxPrice',   String(filters.maxPrice));
  if (filters.maxMileage) p.set('maxMileage', String(filters.maxMileage));
  if (filters.minYear)    p.set('minYear',    String(filters.minYear));

  const res  = await fetch('https://dry-flower-1894.phetatwo.workers.dev?' + p.toString());
  const text = await res.text();
  const data = JSON.parse(text.split('\n')[0]);
  const tiles = (data.search?.tiles || []).filter(t => t.type.includes('LISTING') && t.data);
  return { total: data.search?.totalListings ?? 0, listings: tiles.map(extractListing) };
}

function buildCSV(rows) {
  const headers = [
    'id','searchLabel','searchLocation','title','year','make','model','trim',
    'price','mileage','dealRating','dealScore','daysOnMarket','distance',
    'drivetrain','transmission','engine','seller','sellerCity','photos','vin','url'
  ];
  const escape = v => {
    const s = String(v ?? '');
    return s.includes(',') || s.includes('"') ? `"${s.replace(/"/g,'""')}"` : s;
  };
  return [headers.join(','), ...rows.map(r => headers.map(h => escape(r[h])).join(','))].join('\n');
}

async function runSearches() {
  if (watchlist.length === 0) return alert('Add at least one car to your watchlist.');
  if (locations.length  === 0) return alert('Add at least one location.');

  const btn = document.getElementById('runBtn');
  const logBox = document.getElementById('logBox');
  const progressBar = document.getElementById('progressBar');
  const downloadBtn = document.getElementById('downloadBtn');

  btn.disabled = true;
  btn.textContent = '⏳ Running...';
  logBox.innerHTML = '';
  logBox.classList.add('visible');
  progressBar.classList.add('visible');
  downloadBtn.classList.remove('visible');
  lastCSV = null;

  const filters = {
    newUsed:    document.getElementById('newUsed').value,
    maxPrice:   Number(document.getElementById('maxPrice').value) || null,
    maxMileage: Number(document.getElementById('maxMileage').value) || null,
    minYear:    Number(document.getElementById('minYear').value) || null,
  };

  const total = watchlist.length * locations.length;
  const allResults = [];
  let done = 0;

  log(`Starting ${total} search${total > 1 ? 'es' : ''}...`, 'info');

  for (const loc of locations) {
    for (const car of watchlist) {
      done++;
      log(`[${done}/${total}] ${car.label} · ${loc.label} (${loc.distance}km)`);
      try {
        const result = await searchOne(car, loc, filters);
        log(`  ✓ ${result.total} listings found (${result.listings.length} loaded)`, 'ok');
        result.listings.forEach(l => allResults.push({ ...l, searchLabel: car.label, searchLocation: loc.label }));
      } catch(e) {
        log(`  ✗ ${e.message}`, 'err');
      }
      setProgress(done, total);
      await new Promise(r => setTimeout(r, 500));
    }
  }

  log(`\nDone! ${allResults.length} total listings collected.`, 'highlight');

  // Top 5
  const top5 = [...allResults].sort((a,b) => b.dealScore - a.dealScore).slice(0, 5);
  if (top5.length) {
    log('── Top Deals ──', 'info');
    top5.forEach((l, i) => log(`${i+1}. ${l.title} $${Number(l.price).toLocaleString()} · ${Number(l.mileage).toLocaleString()}km · ${l.dealRating}`));
  }

  lastCSV = buildCSV(allResults);
  downloadBtn.classList.add('visible');
  downloadBtn.onclick = () => {
    const blob = new Blob([lastCSV], { type: 'text/csv' });
    Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: `car-deals-${new Date().toISOString().slice(0,10)}.csv`
    }).click();
  };

  btn.disabled = false;
  btn.textContent = '🔍 Run Searches';
}

// ── Init ───────────────────────────────────────────────────────────────────
initMakeDropdown();
render();
</script>
